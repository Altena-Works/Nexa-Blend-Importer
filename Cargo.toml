[workspace]
members = ["crates/nexa-blend-camera", "crates/nexa-blend-importer", "crates/nexa-blend-importer-plugin"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "A Blender model, animation and camera importer for MikuMikuDance"
publish = false
license = "Apache-2.0"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = true
